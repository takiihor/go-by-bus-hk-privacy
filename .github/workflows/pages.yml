# Publishes this repository to GitHub Pages.
#
# The repository holds only the public legal pages for Take Me by Bus. The
# application itself is developed privately; nothing here is built from it
# automatically, so a change to the app cannot silently alter the published
# policy.
name: Publish privacy policy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in flight: this URL is referenced from published app
# store listings, and a half-replaced page is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
